name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  EXPORT_PRESET_NAME: "iOS"
  APP_NAME: "FiveNightsAtPaws"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Blender
        run: |
          brew install --cask blender
          mkdir -p ~/Library/Application\ Support/Godot/
          echo 'filesystem/import/blender/blender_path = "/Applications/Blender.app/Contents/MacOS/Blender"' >> ~/Library/Application\ Support/Godot/editor_settings-4.tres

      - name: Setup Godot and Export Templates
        run: |
          curl -LO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip"
          mv "Godot.app" /Applications/Godot.app

          curl -LO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/

      - name: Import Assets and Export Xcode Project
        run: |
          mkdir -p build/ios
          # 1. Принудительный первичный импорт всех ассетов и текстур
          /Applications/Godot.app/Contents/MacOS/Godot --headless --editor --quit || true
          
          # 2. Непосредственно экспорт уже с готовым кэшем текстур
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "${EXPORT_PRESET_NAME}" build/ios/${APP_NAME}.xcodeproj

      - name: Build and Package Unsigned IPA via Xcode
        run: |
          cd build/ios
          xcodebuild clean build \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/output"

          mkdir -p Payload
          cp -r output/*.app Payload/
          zip -qr "${APP_NAME}_unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: build/ios/${{ env.APP_NAME }}_unsigned.ipa
          retention-days: 7
